distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Gradle 9.6.0: the minimum (and default) version for AGP 9.4. Lint flags
# 9.8.2 as newer; we stay on the AGP-tested default.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.6.0-bin.zip
# Raised from the default 10s: one GitHub release-asset CDN address is
# blackholed from this network, and the default budget times out on it.
networkTimeout=60000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
